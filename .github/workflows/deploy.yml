name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Deploy to EC2 via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/aws-microservice-0.0.1-SNAPSHOT.jar"
          target: "/home/${{ secrets.EC2_USERNAME }}/app"
          strip_components: 1

      - name: Restart Spring Boot application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/app
            # Find and kill the running Java process
            pkill -f '[j]ava -jar aws-microservice' || true
            sleep 2
            # Start the new application in the background
            nohup java -jar aws-microservice-0.0.1-SNAPSHOT.jar --spring.profiles.active=dev --spring.servlet.multipart.max-file-size=10MB --spring.servlet.multipart.max-request-size=10MB > app.log 2>&1 &
